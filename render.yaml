# Render Blueprint: one web service per study, each with a persistent disk for its SQLite file.
# Delete the services for topics you are not using; each one is billed separately.
services:
  - type: web
    name: madina-sme-records
    runtime: node
    rootDir: 01-madina-sme-records
    plan: starter # persistent disks need a paid instance
    region: frankfurt # closest Render region to Ghana
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: DATABASE_PATH
        value: /var/data/responses.db
      - key: ADMIN_PASSWORD
        sync: false # Render asks for this when you create the Blueprint
    disk:
      name: survey-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: upsa-student-budgeting
    runtime: node
    rootDir: 02-upsa-student-budgeting
    plan: starter
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: DATABASE_PATH
        value: /var/data/responses.db
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: survey-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: upsa-student-entrepreneurs
    runtime: node
    rootDir: 03-upsa-student-entrepreneurs
    plan: starter
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: DATABASE_PATH
        value: /var/data/responses.db
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: survey-data
      mountPath: /var/data
      sizeGB: 1
